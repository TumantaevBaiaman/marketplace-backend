[tool.poetry]
name = "marketplace-backend"
version = "0.1.0"
description = ""
authors = ["TumantaevBaiaman <tumantaev.baiaman.space@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.135.1"
uvicorn = "^0.42.0"
sqlalchemy = {version = ">=2.0", extras = ["asyncio"]}
asyncpg = "^0.31.0"
redis = {extras = ["asyncio"], version = "^7.3.0"}
pydantic-settings = "^2.13.1"
minio = "^7.2.20"
alembic = "^1.18.4"
pydantic = {extras = ["email"], version = "^2.12.5"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pyjwt = {extras = ["crypto"], version = "^2.12.1"}
pillow = "^12.1.1"
python-multipart = "^0.0.22"
python-json-logger = "^4.0.0"
prometheus-fastapi-instrumentator = "^7.1.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-mock = "^3.15.1"
pytest-cov = "^7.1.0"
ruff = "^0.15.7"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy string forward references are resolved at runtime — not undefined names
"src/infrastructure/database/models/*.py" = ["F821", "E731"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
