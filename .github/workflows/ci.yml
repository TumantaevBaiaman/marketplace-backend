name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── 1. Lint · Typecheck · Unit tests ────────────────────────────────────────
  check:
    name: Lint · Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==2.1.1

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev

      - name: Lint (ruff)
        run: poetry run ruff check src

      - name: Format check (ruff)
        run: poetry run ruff format src --check

      - name: Unit tests with coverage
        run: |
          poetry run pytest tests/ -v --tb=short \
            --cov=src --cov-report=xml --cov-report=term-missing
        env:
          # unit-тесты не требуют БД — всё мокируется
          APP_ENV: test
          JWT__SECRET_KEY: test-secret-key-for-ci-only

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  # ── 2. Build Docker image ────────────────────────────────────────────────────
  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --target runtime \
            -t marketplace-backend:${{ github.sha }} \
            .

      - name: Verify image starts
        run: |
          docker run --rm \
            -e APP_ENV=test \
            -e DB__HOST=localhost \
            -e DB__PORT=5432 \
            -e DB__NAME=test \
            -e DB__USER=test \
            -e DB__PASSWORD=test \
            -e REDIS__HOST=localhost \
            -e REDIS__PORT=6379 \
            -e MINIO__ENDPOINT=localhost:9000 \
            -e MINIO__ACCESS_KEY=test \
            -e MINIO__SECRET_KEY=test \
            -e JWT__SECRET_KEY=test-secret-key \
            marketplace-backend:${{ github.sha }} \
            python -c "import main; print('Import OK')"
